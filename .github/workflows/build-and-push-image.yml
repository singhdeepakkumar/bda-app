name: Build and Push docker image of the candidate model to the docker dub

on:
  repository_dispatch:
    types: [deploy-app-model]
  workflow_dispatch:
    inputs:
      model_version:
        description: "Enter model version to deploy"
        required: true
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/telecomcustomerchurn-app
  MODEL_NAME: DecisionTreeTelecomCustomerChurnModel
  MLFLOW_TRACKING_URI: https://dagshub.com/singhdeepakkumar/my-bda-repo.mlflow
  PROMOTED_VERSION: model-${{ github.event.inputs.model_version || github.event.client_payload.model_version }}

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v3

      #- name: Set up Python
      #  if: runner.os != 'Linux' || runner.name != 'self-hosted' # Only run on GitHub-hosted runners
      #  uses: actions/setup-python@v4
      #  with:
      #    python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install mlflow
          pip install mlflow[extras]

      - name: Download promoted model from MLflow
        run: |
          python <<EOF
          import os
          import mlflow
          from mlflow.tracking import MlflowClient

          model_name = os.environ["MODEL_NAME"]
          model_uri = f"models:/{model_name}@candidate"
          target_dir = "app_model"

          print(f"Downloading model from alias: candidate ({model_uri})")

          mlflow.artifacts.download_artifacts(
              artifact_uri=model_uri,
              dst_path=target_dir
          )

          print(f"Model downloaded to: {target_dir}")

          version_file = os.path.join("app_model", "model_version.txt")
          with open(version_file, "w") as f:
              f.write(os.getenv("PROMOTED_VERSION", "unknown"))

          print("Model downloaded and version recorded.")
          EOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build the docker image
        run: |
          IMAGE_TAG="${{ env.PROMOTED_VERSION }}"
          docker build -t $DOCKER_IMAGE:$IMAGE_TAG .
          docker push $DOCKER_IMAGE:$IMAGE_TAG

      - name: Push the docker image to Docker Hub
        run: |
          IMAGE_TAG="${{ env.PROMOTED_VERSION }}"
          docker push $DOCKER_IMAGE:$IMAGE_TAG
